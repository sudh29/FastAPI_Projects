version: '3.8'

services:
  web:
    build: .
    container_name: flask-store-api
    user: "1000:1000"  # Run as non-root user with UID 1000
    command: >
      sh -c "gunicorn --workers 2 --bind 0.0.0.0:5000 app:app"
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
