<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>Library Manager</h1>
            <p>Manage your collection with style</p>
        </header>

        <main>
            <section class="glass-panel form-section">
                <h2>Add New Book</h2>
                <form id="add-book-form">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author" required minlength="1">
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" required minlength="1" maxlength="100">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rating">Rating (1-5)</label>
                            <input type="number" id="rating" name="rating" min="1" max="5" required>
                        </div>
                        <div class="form-group">
                            <label for="published_date">Year</label>
                            <input type="number" id="published_date" name="published_date" min="2000" max="2030"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Add Book</button>
                </form>
            </section>

            <section class="glass-panel list-section">
                <div class="list-header">
                    <h2>My Collection</h2>
                    <div class="filters">
                        <select id="rating-filter">
                            <option value="">All Ratings</option>
                            <option value="5">5 Stars</option>
                            <option value="4">4 Stars</option>
                            <option value="3">3 Stars</option>
                            <option value="2">2 Stars</option>
                            <option value="1">1 Star</option>
                        </select>
                        <button id="refresh-btn" class="btn-icon" title="Refresh">↻</button>
                    </div>
                </div>
                <div id="books-container" class="books-grid">
                    <!-- Books will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close">&times;</span>
            <h2>Edit Book</h2>
            <form id="edit-book-form">
                <input type="hidden" id="edit-id" name="id">
                <div class="form-group">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" name="title" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="edit-author">Author</label>
                    <input type="text" id="edit-author" name="author" required minlength="1">
                </div>
                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <input type="text" id="edit-description" name="description" required minlength="1" maxlength="100">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-rating">Rating (1-5)</label>
                        <input type="number" id="edit-rating" name="rating" min="1" max="5" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-published_date">Year</label>
                        <input type="number" id="edit-published_date" name="published_date" min="2000" max="2030"
                            required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Update Book</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
