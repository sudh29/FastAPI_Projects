version: '3.8'

services:
  backend:
    build: ./backend
    container_name: crypto_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev_secret_key
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: crypto_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
