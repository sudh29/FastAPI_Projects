{% extends "layout.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        Edit Todo
    </div>
    <div class="card-body">
        <form action="/edit-todo/{{ todo.id }}" method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ todo.title }}" required
                    minlength="3">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" id="description" name="description"
                    value="{{ todo.description }}" required minlength="3" maxlength="100">
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority">
                    <option value="1" {% if todo.priority==1 %}selected{% endif %}>1 (High)</option>
                    <option value="2" {% if todo.priority==2 %}selected{% endif %}>2</option>
                    <option value="3" {% if todo.priority==3 %}selected{% endif %}>3 (Medium)</option>
                    <option value="4" {% if todo.priority==4 %}selected{% endif %}>4</option>
                    <option value="5" {% if todo.priority==5 %}selected{% endif %}>5 (Low)</option>
                </select>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="complete" name="complete" {% if todo.complete
                    %}checked{% endif %}>
                <label class="form-check-label" for="complete">Complete</label>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
