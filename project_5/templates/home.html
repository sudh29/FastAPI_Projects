{% extends "layout.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>My Todos</h1>
    <a href="/add-todo" class="btn btn-primary">Add New Todo</a>
</div>

<div class="card">
    <div class="card-body">
        {% if todos %}
        {% for todo in todos %}
        <div class="todo-item d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 {% if todo.complete %}text-decoration-line-through text-muted{% endif %}">{{ todo.title
                    }}</h5>
                <p class="mb-0 text-muted">{{ todo.description }}</p>
                <small class="text-muted">Priority: {{ todo.priority }}</small>
            </div>
            <div class="todo-actions">
                <a href="/edit-todo/{{ todo.id }}" class="btn btn-sm btn-outline-warning">Edit</a>
                <a href="/delete/{{ todo.id }}" class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
        </div>
        {% endfor %}
        {% else %}
        <p class="text-center text-muted">No todos found. Create one!</p>
        {% endif %}
    </div>
</div>
{% endblock %}
